<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
    <div class="h-screen w-full">
        <div class="h-full w-full flex items-center justify-center">
            <div class="flex flex-col bg-[gray] gap-5 p-5 rounded-[25px] shadow-[10px] border-2 border-[black]">
                <span class="h-[50px] bg-[white] flex items-center justify-center text-[25px] font-bold border-2 rounded-[10px]" id="sekundomer">
                    <span id="hour">00</span>:
                    <span id="min">00</span>:
                    <span id="sek">00</span>
                </span>
                <div>
                    <button type="button" class="p-3 bg-[blue] text-[white]" id="start">Start</button>
                    <button type="button" class="p-3 bg-[red] text-[white]" id="stop">Stop</button>
                    <button type="reset" class="p-3 bg-[green] text-[white]" id="reset">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
